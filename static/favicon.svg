<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Metrognome">
	<defs>
		<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#7c5cff" />
			<stop offset="1" stop-color="#4cc9f0" />
		</linearGradient>
	</defs>
	<rect width="512" height="512" rx="112" fill="#0f1115" />
	<rect width="512" height="512" rx="112" fill="url(#g)" opacity="0.16" />
	<!-- metronome body -->
	<path
		d="M206 140 H306 L350 372 a18 18 0 0 1 -18 22 H180 a18 18 0 0 1 -18 -22 Z"
		fill="url(#g)"
	/>
	<!-- scale slot -->
	<rect x="247" y="168" width="18" height="178" rx="9" fill="#0f1115" opacity="0.55" />
	<!-- pendulum rod + weight -->
	<g transform="rotate(13 256 360)">
		<rect x="250" y="150" width="12" height="206" rx="6" fill="#0f1115" />
		<rect x="232" y="232" width="48" height="22" rx="6" fill="#0f1115" />
	</g>
	<!-- beat tick -->
	<circle cx="318" cy="150" r="16" fill="url(#g)" />
</svg>
